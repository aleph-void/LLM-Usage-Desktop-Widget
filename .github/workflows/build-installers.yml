name: Build installers

# Push a tag like v1.0.0 (matching __version__ in usage_widget.py) to build all
# installers and attach them to a GitHub release. Run manually to just build them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# All actions run on the Node 24 runtime.

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/linux/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: dist/*.deb

  # Install the .deb on each supported Ubuntu LTS and make sure it starts and finds AppIndicator.
  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-deb
          path: dist
      - name: Install the package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/*.deb python3-tk python3-boto3
      - name: Run it
        run: |
          llm-usage-widget --version
          llm-usage-widget --once
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/lib/llm-usage-widget'); import usage_widget as w; assert w.load_appindicator(), 'AppIndicator typelib not found'; import boto3"

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
          - runner: macos-15-intel     # Intel
    runs-on: ${{ matrix.runner }}
    # Developer ID signing + notarization run when these secrets are set (same names as the
    # other Aleph Void repos). Without them the build is unsigned, which a tag release refuses.
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
      AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyinstaller -r requirements.txt
      - name: Require signing secrets for a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          missing=""
          for s in MAC_CERT_P12_BASE64 MAC_INSTALLER_CERT_P12_BASE64 AC_API_KEY_P8_BASE64; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          [ -z "$missing" ] || { echo "::error::Missing macOS signing secret(s):$missing; refusing to release an unsigned .pkg"; exit 1; }
      - name: Import Developer ID certificates
        if: env.MAC_CERT_P12_BASE64 != '' && env.MAC_INSTALLER_CERT_P12_BASE64 != ''
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Ephemeral keychain with a random password; it goes away with the runner.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "::add-mask::$KCPW"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MAC_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -P "$MAC_CERT_PASSWORD" -k "$KEYCHAIN" -A -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -P "$MAC_INSTALLER_CERT_PASSWORD" -k "$KEYCHAIN" -A -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          # Let codesign and pkgbuild use the keys without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN"
          # pkgbuild also searches the default keychain, so make this one visible and the default.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -d user -s "$KEYCHAIN"
          app_id="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -n1 | awk -F'"' '{print $2}')"
          installer_id="$(security find-identity -v "$KEYCHAIN" | grep 'Developer ID Installer' | head -n1 | awk -F'"' '{print $2}')"
          [ -n "$app_id" ] || { echo "::error::No 'Developer ID Application' identity in MAC_CERT_P12_BASE64"; exit 1; }
          [ -n "$installer_id" ] || { echo "::error::No 'Developer ID Installer' identity in MAC_INSTALLER_CERT_P12_BASE64"; exit 1; }
          {
            echo "SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "CODESIGN_IDENTITY=$app_id"
            echo "INSTALLER_SIGN_IDENTITY=$installer_id"
          } >> "$GITHUB_ENV"
      - run: packaging/macos/build-pkg.sh
      # Run the frozen app: catches modules PyInstaller missed and crashes at startup.
      - name: Run it
        run: |
          app="build/macos/dist/LLM Usage.app/Contents/MacOS/LLM Usage"
          "$app" --version
          "$app" --once
          "$app" & pid=$!
          sleep 10
          kill -0 "$pid" || { echo "menu-bar app exited at startup"; exit 1; }
          kill "$pid"
      - name: Notarize and staple
        if: env.INSTALLER_SIGN_IDENTITY != '' && env.AC_API_KEY_P8_BASE64 != ''
        timeout-minutes: 50
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$AC_API_KEY_P8_BASE64" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID")
          for pkg in dist/*.pkg; do
            # `submit --wait` exits 0 even when the status is Invalid, so check it and print the log.
            xcrun notarytool submit "$pkg" "${auth[@]}" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json" || true
            cat "$RUNNER_TEMP/notary.json"
            if [ "$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json")" != "Accepted" ]; then
              id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")
              [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}" || true
              exit 1
            fi
            xcrun stapler staple "$pkg"
            xcrun stapler validate "$pkg"
            spctl -a -vvv -t install "$pkg"
          done
          rm -f "$key"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-pkg-${{ matrix.runner }}
          path: dist/*.pkg

  # Windows builds are Authenticode-signed with Azure Trusted Signing (the key never leaves
  # Azure): the app's .exe before it is packaged, then the setup .exe. A tag build refuses to
  # publish anything unsigned; a manual run without the secrets builds unsigned, with a warning.
  # See "Code signing (Windows)" in README.md for the secrets and the certificate profile.
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller -r requirements.txt

      - name: Require Windows signing config
        shell: bash
        run: |
          if [ "$SIGN" != "true" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Azure Trusted Signing secrets not set; refusing to publish an UNSIGNED Windows installer. See 'Code signing (Windows)' in README.md."
              exit 1
            fi
            echo "::warning::Azure Trusted Signing secrets not set; this build is UNSIGNED and SmartScreen will warn about it."
          fi

      - name: Build app
        run: packaging/windows/build.ps1 -Step app
        shell: pwsh

      - name: Sign app (Azure Trusted Signing)
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZ_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZ_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZ_TS_PROFILE }}
          # Only our own launcher. The DLLs and .pyd files under _internal\ are Python's and
          # third-party packages' (python3*.dll and the VC runtime already carry their vendors'
          # signatures), so not recursing keeps our name off code we didn't write.
          files-folder: build/windows/dist/LLMUsageWidget
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The signing action can succeed without signing the file we care about, so check it,
      # and check that the certificate shows the company name without an address.
      - name: Verify app signature
        if: env.SIGN == 'true'
        run: packaging/windows/verify-signature.ps1 build/windows/dist/LLMUsageWidget/LLMUsageWidget.exe
        shell: pwsh

      - name: Build installer
        run: packaging/windows/build.ps1 -Step installer
        shell: pwsh

      - name: Sign installer (Azure Trusted Signing)
        if: env.SIGN == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZ_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZ_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZ_TS_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify installer signature
        if: env.SIGN == 'true'
        run: packaging/windows/verify-signature.ps1 (Get-ChildItem dist -Filter *-windows-setup.exe).FullName
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: dist/*-windows-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-test, macos, windows]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches __version__
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' usage_widget.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match __version__ $v"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
